<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>V4 CRM Bridge - Moskit Preview</title>
  <style>
    :root{--bg:#050505;--card:#11160f;--line:#2a3523;--text:#f6f8f2;--muted:#9faa98;--v4:#b7ff2a;--red:#ff6b6b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,Segoe UI,sans-serif;padding:24px}.wrap{max-width:960px;margin:auto}.card{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:20px;margin-bottom:16px}h1{font-size:36px;margin:0 0 8px}.muted{color:var(--muted)}button{border:0;border-radius:12px;padding:12px 16px;font-weight:900;background:var(--v4);color:#050505;cursor:pointer}pre{white-space:pre-wrap;word-break:break-word;background:#080a08;border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--text)}.danger{color:var(--red)}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>Preview Moskit</h1>
      <p class="muted">Consulta o Moskit pelo backend e retorna dados normalizados. Não escreve na planilha.</p>
      <button id="run">Testar Moskit</button>
    </section>
    <section class="card">
      <h2>Resultado</h2>
      <pre id="out">Aguardando teste.</pre>
    </section>
  </main>
  <script>
    const out = document.getElementById('out');
    document.getElementById('run').addEventListener('click', async () => {
      out.textContent = 'Consultando Moskit...';
      try {
        const response = await fetch('/api/sync', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            client: {
              name: 'Moskit Preview',
              growthpackUrl: 'https://docs.google.com/spreadsheets/d/1KLxctUK2ZGaM7jm1y2zj-StwLTgV6qP0PL1a-ZEnMmo/edit',
              crmTab: 'TESTE_BASE_CRM'
            },
            integration: {
              crm: 'moskit',
              stages: {
                lead: 'Novo Lead',
                mql: ['Primeiro Contato','Qualificação'],
                sql: 'Apresentação/agendamento de reunião',
                opportunity: ['Envio de Proposta','Reunião de Alinhamento','Enviar Contrato','Aguardando Assinatura'],
                won: 'Ganhou',
                lost: 'Perdeu'
              }
            },
            limit: 10,
            writeToSheet: false
          })
        });
        const data = await response.json();
        out.textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        out.innerHTML = '<span class="danger">' + error.message + '</span>';
      }
    });
  </script>
</body>
</html>
