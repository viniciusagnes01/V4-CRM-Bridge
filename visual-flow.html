<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>V4 CRM Bridge</title>
  <style>
    :root{--bg:#050705;--panel:#0b100c;--panel2:#10170f;--glass:rgba(255,255,255,.045);--line:rgba(199,255,47,.16);--line2:rgba(255,255,255,.09);--text:#f5f7ef;--muted:#92a08c;--muted2:#64705f;--v4:#c7ff2f;--v4b:#79ff00;--blue:#58b7ff;--cyan:#4fffe2;--danger:#ff6b6b;--shadow:0 24px 80px rgba(0,0,0,.45)}*{box-sizing:border-box}html,body{min-height:100%;overflow-x:hidden}body{margin:0;background:radial-gradient(circle at 8% -8%,rgba(199,255,47,.20),transparent 360px),radial-gradient(circle at 96% 8%,rgba(79,255,226,.12),transparent 320px),linear-gradient(180deg,#050705,#080b07 42%,#050705);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(199,255,47,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(199,255,47,.035) 1px,transparent 1px);background-size:54px 54px;mask-image:linear-gradient(180deg,rgba(0,0,0,.75),transparent 72%)}.top{height:76px;background:rgba(5,7,5,.76);border-bottom:1px solid var(--line);backdrop-filter:blur(18px);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 28px;position:sticky;top:0;z-index:10}.brand{display:flex;align-items:center;gap:14px}.logo{width:44px;height:44px;border-radius:15px;background:linear-gradient(135deg,var(--v4),var(--v4b));color:#071106;display:grid;place-items:center;font-weight:1000;letter-spacing:-1px;box-shadow:0 0 28px rgba(199,255,47,.30)}.brand h1{font-size:17px;margin:0;letter-spacing:-.2px}.brand span{display:block;color:var(--muted);font-size:12px;margin-top:3px}.top-badge{border:1px solid var(--line);background:rgba(199,255,47,.07);color:var(--v4);border-radius:999px;padding:8px 11px;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.08em}.wrap{display:grid;grid-template-columns:340px minmax(0,1fr);min-height:calc(100vh - 76px)}.side{background:linear-gradient(180deg,rgba(11,16,12,.92),rgba(5,7,5,.86));border-right:1px solid var(--line);padding:34px 26px 28px 42px;position:relative}.side:before{content:"";position:absolute;inset:18px;border:1px solid rgba(199,255,47,.08);border-radius:28px;pointer-events:none}.line{position:absolute;left:70px;top:82px;bottom:112px;width:2px;background:linear-gradient(var(--v4),rgba(199,255,47,.08))}.node{position:relative;display:grid;grid-template-columns:56px 1fr;gap:15px;margin-bottom:30px}.circle{width:56px;height:56px;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.035);display:grid;place-items:center;z-index:2;color:var(--v4);box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}.circle.blue{background:linear-gradient(135deg,rgba(199,255,47,.18),rgba(79,255,226,.08));color:var(--v4)}.circle.green{background:linear-gradient(135deg,rgba(121,255,0,.18),rgba(88,183,255,.07));color:var(--cyan)}.ok{position:absolute;left:-3px;bottom:1px;width:19px;height:19px;border-radius:50%;background:var(--v4);color:#071106;font-size:12px;display:grid;place-items:center;font-weight:1000;z-index:4}.node small{display:block;color:var(--v4);text-transform:uppercase;font-weight:900;font-size:10px;letter-spacing:.11em;margin:2px 0 6px}.node strong{display:block;font-size:14px;line-height:1.35;color:var(--text)}.subs{display:grid;gap:10px;margin-top:14px}.subs span{color:var(--muted2);font-size:13px}.subs .done{color:var(--muted);font-weight:700}.subs .done:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--v4);box-shadow:0 0 12px var(--v4);margin-right:8px;vertical-align:middle}.add{border:1px solid var(--line);background:rgba(199,255,47,.06);color:var(--v4);font-weight:900;border-radius:15px;min-height:46px;width:100%;text-align:left;padding:0 16px;margin-top:4px}.main{padding:48px clamp(20px,6vw,86px)}.panel{max-width:980px;position:relative}.panel:before{content:"V4 FLOW";position:absolute;right:0;top:-28px;color:rgba(199,255,47,.14);font-size:12px;font-weight:1000;letter-spacing:.28em}.panel h2{font-size:clamp(30px,3.2vw,48px);line-height:.98;margin:0 0 30px;color:var(--text);letter-spacing:-1.8px;max-width:780px}.field{margin-bottom:24px}.field label{display:block;margin-bottom:9px;color:var(--muted);font-size:11px;text-transform:uppercase;font-weight:1000;letter-spacing:.08em}.box,input,select{min-height:56px;border:1px solid var(--line2);border-radius:16px;background:rgba(255,255,255,.045);display:flex;align-items:center;padding:0 16px;color:var(--text);font-size:15px;width:100%;outline:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.02);backdrop-filter:blur(10px)}input:focus,select:focus{border-color:rgba(199,255,47,.48);box-shadow:0 0 0 3px rgba(199,255,47,.08)}select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--v4) 50%),linear-gradient(135deg,var(--v4) 50%,transparent 50%);background-position:calc(100% - 18px) 24px,calc(100% - 12px) 24px;background-size:6px 6px,6px 6px;background-repeat:no-repeat}.apps{display:grid;grid-template-columns:repeat(5,minmax(118px,1fr));gap:12px}.app{border:1px solid var(--line2);background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.025));border-radius:20px;padding:15px;text-align:left;cursor:pointer;min-height:126px;color:var(--text);transition:.18s ease;position:relative;overflow:hidden}.app:after{content:"";position:absolute;inset:auto -24px -42px auto;width:90px;height:90px;border-radius:50%;background:rgba(199,255,47,.08);filter:blur(2px)}.app:hover,.app.active{transform:translateY(-2px);border-color:rgba(199,255,47,.55);box-shadow:0 18px 44px rgba(0,0,0,.35),0 0 0 1px rgba(199,255,47,.10) inset;background:linear-gradient(180deg,rgba(199,255,47,.095),rgba(255,255,255,.03))}.appicon{width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,var(--v4),var(--v4b));color:#071106;display:grid;place-items:center;font-size:11px;font-weight:1000;margin-bottom:12px}.app b{position:relative;z-index:1}.app span{position:relative;z-index:1;display:block;font-size:12px;color:var(--muted);margin-top:6px;line-height:1.35}.hr{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:34px 0 28px}.btn{min-height:56px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--v4),var(--v4b));color:#071106;font-weight:1000;font-size:14px;width:100%;cursor:pointer;text-transform:uppercase;letter-spacing:.08em;box-shadow:0 14px 38px rgba(199,255,47,.18);transition:.18s ease}.btn:hover{transform:translateY(-1px);filter:saturate(1.12)}.btn2{background:rgba(255,255,255,.035);color:var(--v4);border:1px solid var(--line);box-shadow:none}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}.chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}.chips span{border:1px solid rgba(199,255,47,.20);background:rgba(199,255,47,.065);color:var(--text);border-radius:999px;padding:8px 11px;font-size:12px}.map{border:1px solid var(--line2);border-radius:20px;overflow:hidden;background:rgba(255,255,255,.035);box-shadow:var(--shadow)}.map table{width:100%;border-collapse:collapse}.map th,.map td{padding:13px 14px;border-bottom:1px solid rgba(255,255,255,.07);text-align:left;font-size:13px}.map th{color:var(--v4);font-size:10px;text-transform:uppercase;letter-spacing:.08em;background:rgba(199,255,47,.04)}.result{background:#050805;color:#eaffd4;border:1px solid var(--line);border-radius:18px;padding:15px;white-space:pre-wrap;word-break:break-word;max-height:320px;overflow:auto;box-shadow:inset 0 0 0 1px rgba(255,255,255,.025)}.hide{display:none}.success{background:rgba(199,255,47,.08);color:var(--v4);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}@media(max-width:1120px){.apps{grid-template-columns:repeat(3,minmax(120px,1fr))}}@media(max-width:980px){.wrap{grid-template-columns:1fr}.side{display:none}.main{padding:28px}.apps{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr}.top{padding:0 18px}.top-badge{display:none}}@media(max-width:560px){.apps{grid-template-columns:1fr}.main{padding:18px}.brand h1{font-size:15px}.panel h2{font-size:30px}}
  </style>
</head>
<body>
<header class="top"><div class="brand"><div class="logo">V4</div><div><h1>CRM Bridge</h1><span>Automação visual para GrowthPack</span></div></div><div class="top-badge">V4 Company OS</div></header>
<div class="wrap">
  <aside class="side"><div class="line"></div><div id="rail"></div><button class="add">＋ CONECTAR NOVA FERRAMENTA</button></aside>
  <main class="main"><section class="panel" id="panel"></section></main>
</div>
<script>
const s={step:1,crm:'Moskit',trigger:'Sincronizar negócios manualmente',client:'Novo cliente',growthpackUrl:'https://docs.google.com/spreadsheets/d/1KLxctUK2ZGaM7jm1y2zj-StwLTgV6qP0PL1a-ZEnMmo/edit',pipeline:'',pipelineId:'',pipelines:[],stages:[],dest:'TESTE_BASE_CRM',syncMode:'upsert'};
const crms=[['Moskit','MOS'],['Kommo','KOM'],['HubSpot','HUB'],['PipeDrive','PIP'],['Bitrix','BIT'],['SULTS','SUL'],['C2S','C2S']];
const fields=[['Data','created_at'],['Lead ID','id'],['Nome','name'],['Nome da Empresa','companyName'],['Valor','value'],['Responsável','owner'],['Motivo de perda','loss_reason']];
const defaultAliases={Moskit:'MOSKIT_ACCESS_KEY',Kommo:'KOMMO_ACCESS_TOKEN',HubSpot:'HUBSPOT_ACCESS_TOKEN',PipeDrive:'PIPEDRIVE_API_TOKEN',Bitrix:'BITRIX_WEBHOOK_URL'};
function e(v){return String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function go(n){syncFields();s.step=n;render()}
function syncFields(){s.client=document.getElementById('clientName')?.value||s.client;s.growthpackUrl=document.getElementById('growthpackUrl')?.value||s.growthpackUrl;s.dest=document.getElementById('dest')?.value||s.dest;s.syncMode=document.getElementById('syncMode')?.value||s.syncMode}
function rail(){document.getElementById('rail').innerHTML=`<div class="node"><div><div class="circle blue">⚡</div><div class="ok">✓</div></div><div><small>${s.crm} CRM</small><strong>1. ${s.trigger}</strong><div class="subs"><span class="done">Selecione sua ferramenta</span><span class="${s.step>1?'done':''}">Conecte sua conta</span><span class="${s.step>2?'done':''}">Ajustes do funil</span><span class="${s.step>3?'done':''}">Filtros e destino</span></div></div></div><div class="node"><div><div class="circle green">▦</div><div class="ok">✓</div></div><div><small>GrowthPack</small><strong>2. Atualizar/inserir linha ao clicar</strong></div></div>`}
function panel(){let p=document.getElementById('panel');if(s.step===1)p.innerHTML=step1();if(s.step===2)p.innerHTML=step2();if(s.step===3)p.innerHTML=step3();if(s.step===4)p.innerHTML=step4();if(s.step===5)p.innerHTML=step5();if(s.step===6)p.innerHTML=step6()}
function step1(){return `<h2>Selecione a ferramenta e o gatilho da sincronização</h2><div class="field"><label>Ferramenta</label><div class="apps">${crms.map(c=>`<button class="app ${s.crm===c[0]?'active':''}" onclick="syncFields();s.crm='${c[0]}';s.pipeline='';s.pipelineId='';s.pipelines=[];s.stages=[];render()"><div class="appicon">${c[1]}</div><b>${c[0]}</b><span>Conectar CRM</span></button>`).join('')}</div></div><div class="field"><label>Ação</label><select onchange="s.trigger=this.value"><option>Sincronizar negócios manualmente</option><option>Sincronizar negócios do funil selecionado</option><option>Atualizar BASE_CRM ao clicar</option></select></div><div class="hr"></div><button class="btn" onclick="go(2)">Salvar e continuar</button>`}
function step2(){return `<h2>Conecte a conta e informe o cliente</h2><div class="row"><div class="field"><label>Cliente</label><input id="clientName" value="${e(s.client)}" placeholder="Ex: Cliente ABC"></div><div class="field"><label>Ferramenta</label><div class="box">${s.crm} CRM</div></div></div><div class="field"><label>Conta</label><div class="box">Conexão segura via ambiente Vercel</div></div><div class="field"><label>Nome da credencial</label><input id="alias" value="${e(defaultAliases[s.crm]||'')}"></div><div class="field"><label>Base URL quando necessário</label><input id="baseUrl" placeholder="Ex: https://suaempresa.kommo.com"></div><div class="hr"></div><button class="btn" onclick="go(3)">Salvar e continuar</button>`}
function step3(){return `<h2>Escolha o funil que alimenta a BASE_CRM</h2><div class="field"><label>Funis e etapas</label><button class="btn btn2" onclick="loadPipes()">Buscar funis e etapas</button></div>${s.pipelines.length?`<div class="field"><label>Funil encontrado</label><select onchange="selectPipe(this.value)">${s.pipelines.map((p,i)=>`<option value="${i}" ${p.id===s.pipelineId?'selected':''}>${e(p.name)} · ${e(p.id)}</option>`).join('')}</select></div>`:`<div class="box">${s.pipeline||'Nenhum funil selecionado'}</div>`}<div class="chips">${s.stages.map(x=>`<span>${e(x.name||x.id)}</span>`).join('')}</div><pre id="out" class="result hide"></pre><div class="hr"></div><button class="btn" onclick="go(4)">Salvar e continuar</button>`}
function step4(){return `<h2>Defina filtros e modo de escrita</h2><div class="row"><div class="field"><label>Funil</label><input value="${e(s.pipeline||'Todos')}"></div><div class="field"><label>Status</label><select><option>Todos</option><option>Abertos</option><option>Ganhos</option><option>Perdidos</option></select></div></div><div class="field"><label>Modo de escrita</label><select id="syncMode" onchange="s.syncMode=this.value"><option value="upsert">Atualizar existentes e inserir novos</option><option value="rebuild">Limpar e reconstruir aba</option></select></div><div class="hr"></div><button class="btn" onclick="go(5)">Salvar e continuar</button>`}
function step5(){return `<h2>Configure o destino GrowthPack</h2><div class="field"><label>URL da GrowthPack</label><input id="growthpackUrl" value="${e(s.growthpackUrl)}" placeholder="Cole a URL da planilha do cliente"></div><div class="row"><div class="field"><label>Aba</label><select id="dest" onchange="s.dest=this.value"><option value="TESTE_BASE_CRM" ${s.dest==='TESTE_BASE_CRM'?'selected':''}>TESTE_BASE_CRM</option><option value="BASE_CRM" ${s.dest==='BASE_CRM'?'selected':''}>BASE_CRM</option></select></div><div class="field"><label>Ação</label><div class="box">Atualizar/inserir linha por Lead ID</div></div></div><div class="hr"></div><button class="btn" onclick="go(6)">Salvar e continuar</button>`}
function step6(){return `<h2>Mapeie os campos e sincronize</h2><div class="map"><table><thead><tr><th>GrowthPack</th><th>Campo do CRM</th></tr></thead><tbody>${fields.map(f=>`<tr><td>${f[0]}</td><td><select><option>${f[1]}</option></select></td></tr>`).join('')}</tbody></table></div><div class="hr"></div><button class="btn btn2" onclick="test()">Testar</button><br><br><button class="btn" onclick="syncNow()">Sincronizar agora</button><pre id="out" class="result hide"></pre>`}
function selectPipe(index){const p=s.pipelines[Number(index)];if(!p)return;s.pipeline=p.name;s.pipelineId=p.id;s.stages=p.stages||[];render()}
async function loadPipes(){let out=document.getElementById('out');out.classList.remove('hide');out.textContent='Buscando funis...';try{let r=await fetch('/api/catalog',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({crm:s.crm,credentialAlias:document.getElementById('alias')?.value||defaultAliases[s.crm],baseUrl:document.getElementById('baseUrl')?.value||''})});let d=await r.json();if(!d.ok){out.textContent=JSON.stringify(d,null,2);return}let pipes=d.pipelines||[];if(!pipes.length){out.textContent='Nenhum funil encontrado.';return}s.pipelines=pipes;let p=pipes[0];s.pipeline=p.name;s.pipelineId=p.id;s.stages=p.stages||[];render()}catch(err){out.textContent=JSON.stringify({ok:false,message:err.message},null,2)}}
function test(){syncFields();let out=document.getElementById('out');out.classList.remove('hide');out.textContent=JSON.stringify({ok:!!s.pipeline,crm:s.crm,cliente:s.client,acao:s.trigger,funil:s.pipeline||'não selecionado',destino:s.dest,modo:s.syncMode,message:s.pipeline?'Pronto para sincronizar ao clicar.':'Busque e selecione um funil antes de sincronizar.'},null,2)}
async function syncNow(){syncFields();let out=document.getElementById('out');out.classList.remove('hide');out.textContent='Sincronizando agora...';try{let body={client:{name:`${s.crm} · ${s.client}`,growthpackUrl:s.growthpackUrl,crmTab:s.dest},integration:{crm:s.crm.toLowerCase(),credentialAlias:document.getElementById('alias')?.value||defaultAliases[s.crm],baseUrl:document.getElementById('baseUrl')?.value||'',pipelineId:s.pipelineId||''},limit:2000,writeToSheet:true,writeMode:s.syncMode||'upsert'};let r=await fetch('/api/sync',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let d=await r.json();out.textContent=JSON.stringify(d,null,2)}catch(err){out.textContent=JSON.stringify({ok:false,message:err.message},null,2)}}
function render(){rail();panel()}render();
</script>
</body>
</html>
