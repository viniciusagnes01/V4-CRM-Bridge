<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>V4 CRM Bridge</title>
  <style>
    :root{--bg:#f5f7fb;--line:#dfe6ef;--text:#344563;--muted:#8a99ad;--blue:#3bb3ef;--green:#35c96f;--v4:#b7ff2a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 32px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--v4),#7dff00);color:#071106;display:grid;place-items:center;font-weight:1000}.top h1{font-size:18px;margin:0}.wrap{display:grid;grid-template-columns:335px 1fr;min-height:calc(100vh - 72px)}.side{background:#fff;border-right:1px solid var(--line);padding:34px 28px 28px 54px;position:relative}.line{position:absolute;left:84px;top:80px;bottom:110px;width:3px;background:#dce4ee}.node{position:relative;display:grid;grid-template-columns:60px 1fr;gap:16px;margin-bottom:30px}.circle{width:60px;height:60px;border-radius:50%;border:4px solid var(--green);background:#fff;display:grid;place-items:center;z-index:2}.circle.blue{background:#215cf6;color:#fff}.circle.green{background:#10a64a;color:#fff}.ok{position:absolute;left:0;bottom:3px;width:18px;height:18px;border-radius:50%;background:#54d67d;color:#fff;font-size:12px;display:grid;place-items:center}.node small{display:block;color:#9caabc;text-transform:uppercase;font-weight:800;font-size:11px;margin:4px 0}.node strong{display:block;font-size:15px;line-height:1.35}.subs{display:grid;gap:11px;margin-top:12px}.subs span{color:#91a0b2;font-size:14px}.subs .done{color:#4fbd72;font-weight:700}.add{border:0;background:#eef7ff;color:#2da5eb;font-weight:800;border-radius:5px;height:44px;width:100%;text-align:left;padding:0 18px}.main{padding:48px 7vw}.panel{max-width:920px}.panel h2{font-size:27px;margin:0 0 30px;color:#3f4f67}.field{margin-bottom:24px}.field label{display:block;margin-bottom:9px;color:#6d7c91}.box,input,select{height:56px;border:1px solid #d7e0eb;border-radius:5px;background:#fff;display:flex;align-items:center;padding:0 16px;color:#41506a;font-size:16px;width:100%}.apps{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.app{border:1px solid #d7e0eb;background:#fff;border-radius:8px;padding:14px;text-align:left;cursor:pointer;min-height:112px}.app.active{border-color:#37aef2;box-shadow:0 0 0 2px rgba(55,174,242,.12)}.appicon{width:36px;height:36px;border-radius:50%;background:#215cf6;color:#fff;display:grid;place-items:center;font-weight:900;margin-bottom:8px}.app span{font-size:12px;color:var(--muted)}.hr{height:1px;background:#dfe6ef;margin:34px 0 28px}.btn{height:54px;border:0;border-radius:5px;background:#43b5ed;color:#fff;font-weight:900;font-size:16px;width:100%;cursor:pointer}.btn2{background:#fff;color:#43a9e6;border:1px solid #cfe5f5}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}.chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}.chips span{border:1px solid #cfe3f1;background:#f2f9ff;color:#42607e;border-radius:999px;padding:7px 10px;font-size:13px}.map{border:1px solid #dfe6ef;border-radius:8px;overflow:hidden;background:#fff}.map table{width:100%;border-collapse:collapse}.map th,.map td{padding:12px;border-bottom:1px solid #edf1f5;text-align:left;font-size:13px}.result{background:#0b1220;color:#eaf1ff;border-radius:8px;padding:14px;white-space:pre-wrap;word-break:break-word;max-height:300px;overflow:auto}.hide{display:none}.success{background:#eaf9f0;color:#249052;border:1px solid #bce9cd;border-radius:8px;padding:12px;margin-top:12px}@media(max-width:980px){.wrap{grid-template-columns:1fr}.side{display:none}.main{padding:24px}.apps{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header class="top"><div class="logo">V4</div><h1>[YOUSAFER] BASE DE LEADS</h1></header>
<div class="wrap">
  <aside class="side"><div class="line"></div><div id="rail"></div><button class="add">＋ CONECTAR NOVA FERRAMENTA</button></aside>
  <main class="main"><section class="panel" id="panel"></section></main>
</div>
<script>
const s={step:1,crm:'Moskit',trigger:'Sincronizar negócios manualmente',pipeline:'',stages:[],dest:'TESTE_BASE_CRM',syncMode:'upsert'};
const crms=[['Moskit','MOS'],['Kommo','KOM'],['HubSpot','HUB'],['PipeDrive','PIP'],['Bitrix','BIT'],['SULTS','SUL'],['C2S','C2S']];
const fields=[['Data','created_at'],['Lead ID','id'],['Nome','name'],['Nome da Empresa','companyName'],['Valor','value'],['Responsável','owner'],['Motivo de perda','loss_reason']];
const defaultAliases={Moskit:'MOSKIT_ACCESS_KEY',Kommo:'KOMMO_ACCESS_TOKEN',HubSpot:'HUBSPOT_ACCESS_TOKEN',PipeDrive:'PIPEDRIVE_API_TOKEN',Bitrix:'BITRIX_WEBHOOK_URL'};
const growthpackUrl='https://docs.google.com/spreadsheets/d/1KLxctUK2ZGaM7jm1y2zj-StwLTgV6qP0PL1a-ZEnMmo/edit';
function e(v){return String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function go(n){s.step=n;render()}
function rail(){document.getElementById('rail').innerHTML=`<div class="node"><div><div class="circle blue">⚡</div><div class="ok">✓</div></div><div><small>${s.crm} CRM</small><strong>1. ${s.trigger}</strong><div class="subs"><span class="done">✓ Selecione sua ferramenta</span><span class="${s.step>1?'done':''}">✓ Conecte sua conta</span><span class="${s.step>2?'done':''}">✓ Ajustes</span><span class="${s.step>3?'done':''}">✓ Filtre as informações</span></div></div></div><div class="node"><div><div class="circle green">▦</div><div class="ok">✓</div></div><div><small>Google Sheets</small><strong>2. Atualizar/inserir linha ao clicar</strong></div></div>`}
function panel(){let p=document.getElementById('panel');if(s.step===1)p.innerHTML=step1();if(s.step===2)p.innerHTML=step2();if(s.step===3)p.innerHTML=step3();if(s.step===4)p.innerHTML=step4();if(s.step===5)p.innerHTML=step5();if(s.step===6)p.innerHTML=step6()}
function step1(){return `<h2>Selecione a ferramenta e como ela irá iniciar sua sincronização</h2><div class="field"><label>Ferramenta</label><div class="apps">${crms.map(c=>`<button class="app ${s.crm===c[0]?'active':''}" onclick="s.crm='${c[0]}';s.pipeline='';s.stages=[];render()"><div class="appicon">${c[1]}</div><b>${c[0]}</b><br><span>Selecionar ferramenta</span></button>`).join('')}</div></div><div class="field"><label>Ação</label><select onchange="s.trigger=this.value"><option>Sincronizar negócios manualmente</option><option>Sincronizar negócios do funil selecionado</option><option>Atualizar BASE_CRM ao clicar</option></select></div><div class="hr"></div><button class="btn" onclick="go(2)">SALVAR E CONTINUAR</button>`}
function step2(){return `<h2>Conecte sua conta</h2><div class="field"><label>Ferramenta</label><div class="box">${s.crm} CRM</div></div><div class="field"><label>Conta</label><div class="box">Credencial segura salva no ambiente</div></div><div class="field"><label>Nome da credencial</label><input id="alias" value="${e(defaultAliases[s.crm]||'')}"></div><div class="field"><label>Base URL quando necessário</label><input id="baseUrl" placeholder="Ex: https://suaempresa.kommo.com"></div><div class="hr"></div><button class="btn" onclick="go(3)">SALVAR E CONTINUAR</button>`}
function step3(){return `<h2>Ajustes da sincronização</h2><div class="field"><label>Funil</label><button class="btn btn2" onclick="loadPipes()">BUSCAR FUNIS E ETAPAS</button></div><div class="box">${s.pipeline||'Nenhum funil selecionado'}</div><div class="chips">${s.stages.map(x=>`<span>${e(x.name||x.id)}</span>`).join('')}</div><pre id="out" class="result hide"></pre><div class="hr"></div><button class="btn" onclick="go(4)">SALVAR E CONTINUAR</button>`}
function step4(){return `<h2>Filtre as informações</h2><div class="row"><div class="field"><label>Funil</label><input value="${e(s.pipeline||'Todos')}"></div><div class="field"><label>Status</label><select><option>Todos</option><option>Abertos</option><option>Ganhos</option><option>Perdidos</option></select></div></div><div class="field"><label>Modo de escrita</label><select onchange="s.syncMode=this.value"><option value="upsert">Atualizar existentes e inserir novos</option><option value="rebuild">Limpar e reconstruir aba</option></select></div><div class="hr"></div><button class="btn" onclick="go(5)">SALVAR E CONTINUAR</button>`}
function step5(){return `<h2>Configure o destino</h2><div class="row"><div class="field"><label>Planilha</label><div class="box">GrowthPack V26</div></div><div class="field"><label>Aba</label><select onchange="s.dest=this.value"><option value="TESTE_BASE_CRM">TESTE_BASE_CRM</option><option value="BASE_CRM">BASE_CRM</option></select></div></div><div class="field"><label>Ação</label><div class="box">Atualizar/inserir linha por Lead ID quando clicar em Sincronizar agora</div></div><div class="hr"></div><button class="btn" onclick="go(6)">SALVAR E CONTINUAR</button>`}
function step6(){return `<h2>Mapeie os campos e sincronize</h2><div class="map"><table><thead><tr><th>Google Sheets</th><th>Campo do CRM</th></tr></thead><tbody>${fields.map(f=>`<tr><td>${f[0]}</td><td><select><option>${f[1]}</option></select></td></tr>`).join('')}</tbody></table></div><div class="hr"></div><button class="btn btn2" onclick="test()">TESTAR</button><br><br><button class="btn" onclick="syncNow()">SINCRONIZAR AGORA</button><pre id="out" class="result hide"></pre>`}
async function loadPipes(){let out=document.getElementById('out');out.classList.remove('hide');out.textContent='Buscando...';try{let r=await fetch('/api/catalog',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({crm:s.crm,credentialAlias:document.getElementById('alias')?.value||defaultAliases[s.crm],baseUrl:document.getElementById('baseUrl')?.value||''})});let d=await r.json();if(!d.ok){out.textContent=JSON.stringify(d,null,2);return}let p=(d.pipelines||[])[0];if(!p){out.textContent='Nenhum funil encontrado.';return}s.pipeline=p.name;s.pipelineId=p.id;s.stages=p.stages||[];render()}catch(err){out.textContent=JSON.stringify({ok:false,message:err.message},null,2)}}
function test(){let out=document.getElementById('out');out.classList.remove('hide');out.textContent=JSON.stringify({ok:!!s.pipeline,crm:s.crm,acao:s.trigger,funil:s.pipeline||'não selecionado',destino:s.dest,modo:s.syncMode,message:s.pipeline?'Pronto para sincronizar ao clicar.':'Busque e selecione um funil antes de sincronizar.'},null,2)}
async function syncNow(){let out=document.getElementById('out');out.classList.remove('hide');out.textContent='Sincronizando agora...';try{let body={client:{name:`${s.crm} · YouSafer`,growthpackUrl,crmTab:s.dest},integration:{crm:s.crm.toLowerCase(),credentialAlias:document.getElementById('alias')?.value||defaultAliases[s.crm],baseUrl:document.getElementById('baseUrl')?.value||'',pipelineId:s.pipelineId||''},limit:2000,writeToSheet:true,writeMode:s.syncMode||'upsert'};let r=await fetch('/api/sync',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let d=await r.json();out.textContent=JSON.stringify(d,null,2)}catch(err){out.textContent=JSON.stringify({ok:false,message:err.message},null,2)}}
function render(){rail();panel()}render();
</script>
</body>
</html>
